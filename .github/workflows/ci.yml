name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint & format
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version-file: '.node-version'
                  cache: 'npm'
            - run: npm ci
            - run: npm run format
            - run: npm run lint

    typecheck:
        name: Type check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version-file: '.node-version'
                  cache: 'npm'
            - run: npm ci
            - run: npm run type-check

    test:
        name: Test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version-file: '.node-version'
                  cache: 'npm'
            - run: npm ci
            - run: npm run build -w packages/shared
            - run: npm test

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version-file: '.node-version'
                  cache: 'npm'
            - run: npm ci
            - run: npm run build
